name: Generate Pinterest wallpapers

on:
  workflow_dispatch:
    inputs:
      board_url:
        description: 'Public Pinterest board URL (https://www.pinterest.com/username/board/)'
        required: true
        type: string
  pull_request:
    paths:
      - 'pinterest_wall.py'
      - 'tests/test_pinterest_wall.py'
      - 'requirements.txt'
      - '.github/workflows/generate-pinterest-wallpaper.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Pinterest collection and mosaic layout
        run: python -m unittest discover -s tests -v

  generate:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: write
    concurrency:
      group: pinterest-output-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate desktop and phone wallpapers
        env:
          PINTEREST_BOARD_URL: ${{ inputs.board_url }}
        run: python pinterest_wall.py "$PINTEREST_BOARD_URL"
      - name: Upload wallpapers and image manifest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pinterest-wallpapers-${{ github.run_id }}
          path: |
            output/pinterest/desktop.jpg
            output/pinterest/phone.jpg
            output/pinterest/manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit wallpapers to output directory
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- output/pinterest/desktop.jpg output/pinterest/phone.jpg output/pinterest/manifest.json
          if git diff --cached --quiet; then
            echo "Wallpapers unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Update Pinterest wallpapers"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
